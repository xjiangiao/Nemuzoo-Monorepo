name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "apps/medusa-backend/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy-backend.yml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/medusa-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/medusa-backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            mkdir -p /opt/medusa
            cd /opt/medusa

            # Write docker-compose.yml
            cat > docker-compose.yml << 'COMPOSEEOF'
            services:
              medusa-backend:
                image: ghcr.io/${{ env.IMAGE_NAME }}:latest
                container_name: medusa-backend
                restart: unless-stopped
                ports:
                  - "9000:9000"
                env_file:
                  - .env
                environment:
                  - NODE_ENV=production
                healthcheck:
                  test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/health"]
                  interval: 30s
                  timeout: 10s
                  retries: 3
                  start_period: 30s
            COMPOSEEOF

            # Write .env from GitHub Secrets on every deploy
            cat > .env << 'ENVEOF'
            NODE_ENV=production
            PORT=9000
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            REDIS_URL=${{ secrets.REDIS_URL }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            COOKIE_SECRET=${{ secrets.COOKIE_SECRET }}
            STORE_CORS=${{ vars.STORE_CORS }}
            ADMIN_CORS=${{ vars.ADMIN_CORS }}
            AUTH_CORS=${{ vars.AUTH_CORS }}
            MEDUSA_ADMIN_ONBOARDING_TYPE=default
            R2_FILE_URL=${{ secrets.R2_FILE_URL }}
            R2_ENDPOINT=${{ secrets.R2_ENDPOINT }}
            R2_BUCKET=${{ secrets.R2_BUCKET }}
            R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
            R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
            ENVEOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ env.IMAGE_NAME }}:latest
            docker compose down medusa-backend
            docker compose up -d medusa-backend
            docker image prune -f
            docker logout ghcr.io
